<rect class="elbg" x="231" y="386" width="54" height="17" rx="3"/>
<text class="el" x="258" y="398" text-anchor="middle">重新讀取</text>
</g>
<g class="n rect start" data-step="1"><rect class="shape" x="64" y="30" width="135" height="39" rx="3"/>
<text x="132" y="53" text-anchor="middle">殼啟動
