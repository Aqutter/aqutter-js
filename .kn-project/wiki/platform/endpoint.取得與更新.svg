</g>
<g class="n rect key" data-step="4"><rect class="shape" x="93" y="326" width="78" height="39" rx="3"/>
<text x="132" y="349" text-anchor="middle">建立連線</text>
</g>
<g class="n rect ext" data-step="5"><rect class="shape" x="80" y="432" width="103" height="39" rx="3"/>
<text x="132" y="455" text-anchor="middle">殼重啟伺服器</text>
</g>
<g class="n rect" data-step="6"><rect class="shape" x="30" y="538" width="90" height="39" rx="3"/>
<text x="75" y="561" text-anchor="middle">殼更新全域</text>
</g>
<g class="n rect" data-step="6"><rect class="shape" x="156" y="538" width="78" height="39" rx="3"/>
<text x="195" y="561" text-anchor="middle">連線中斷</text>
</g>
</svg>